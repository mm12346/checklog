<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body {

            scrollbar-width: thin;

        }

        }

            background-color: #cbd5e1;
            border-radius: 4px;

            position: sticky;
            top: 0;
            background-color: #fee2e2;
            z-index: 10;

            max-height: 250px;

    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-40 w-full bg-white/95 backdrop-blur-sm border-b border-red-200 shadow-sm">
            <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
                <div class="py-4 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
                    
                    <div class="flex items-center gap-3">
                        <button onclick="window.history.back()" title="กลับไปหน้าหลัก" class="p-2 text-slate-500 hover:bg-red-50 hover:text-red-700 rounded-full transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m8-8l-8 8 8 8" /></svg>
                        </button>
                        <div class="flex items-center gap-2">
                            <div class="p-1.5 bg-red-100 text-red-600 rounded-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                </svg>
                            </div>
                            <h1 class="text-xl font-bold text-slate-800">สรุปอุปกรณ์ชำรุด <span class="text-sm font-medium text-red-500 bg-red-50 px-2 py-0.5 rounded-full ml-2">Defect Report</span></h1>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                        <div class="relative w-full sm:w-48" id="branch-select-container">
                            <button id="branch-dropdown-btn" class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-xl flex items-center justify-between text-sm text-slate-700 font-medium hover:bg-slate-200 transition shadow-sm">
                                <span id="branch-dropdown-label" class="truncate">กำลังโหลดสาขา...</span>
                                <svg class="w-4 h-4 ml-2 shrink-0 transition-transform duration-200" id="branch-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div id="branch-dropdown-menu" class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-xl z-50 p-3 dropdown-menu">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">
                                    <button id="branch-select-all" class="text-xs text-red-600 font-bold hover:underline">เลือกทั้งหมด</button>
                                    <button id="branch-clear-all" class="text-xs text-slate-500 font-bold hover:underline">ล้างทั้งหมด</button>
                                </div>
                                <div id="branch-checkboxes" class="space-y-2 max-h-40 overflow-y-auto"></div>
                            </div>
                        </div>

                        <div class="relative w-full sm:w-56" id="device-select-container">
                            <button id="device-dropdown-btn" class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-xl flex items-center justify-between text-sm text-slate-700 font-medium hover:bg-slate-200 transition shadow-sm">
                                <span id="device-dropdown-label" class="truncate">กำลังโหลดอุปกรณ์...</span>
                                <svg class="w-4 h-4 ml-2 shrink-0 transition-transform duration-200" id="device-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div id="device-dropdown-menu" class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-xl z-50 p-3 dropdown-menu min-w-max">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">

                        <div class="flex items-center gap-2 flex-grow sm:w-auto">

                            <label class="flex items-center gap-2 cursor-pointer bg-slate-100 border border-slate-300 rounded-xl px-3 py-2 shadow-sm hover:bg-slate-200 transition">
                                <input type="checkbox" id="filter-all-month" class="rounded text-red-600 focus:ring-red-500 w-4 h-4 cursor-pointer transition">
                                <span class="text-sm font-bold text-slate-700 whitespace-nowrap">ดูทั้งเดือน</span>
                            </label>
                        </div>

                        <div class="flex items-center gap-2">
                            <button id="refresh-button" title="ค้นหาข้อมูลชำรุด" class="px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded-xl shadow-sm transition flex items-center justify-center gap-2 font-semibold w-full sm:w-auto">
                                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <span>ค้นหา</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="p-4 sm:p-6 lg:p-8 max-w-[1600px] mx-auto w-full flex-grow flex flex-col">
            
            <div class="bg-white rounded-t-2xl shadow-sm border border-slate-200 border-b-0 p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="flex items-center gap-3">
                    <div id="loading-indicator" class="hidden loader-sm animate-spin rounded-full border-2 border-slate-300 border-t-red-600"></div>
                    <p class="text-sm font-medium text-slate-600" id="status-text">รอการกดค้นหาข้อมูล...</p>
                </div>
                <div class="text-sm font-semibold text-slate-700 bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">
                    พบรายการชำรุดรวม: <span id="total-defects" class="text-red-600 text-lg">0</span> รายการ
                </div>
            </div>

            <div class="bg-white rounded-b-2xl shadow-lg border border-slate-200 overflow-hidden flex-grow relative min-h-[400px]">
                <div class="defect-table-container overflow-auto absolute inset-0">
                    <table class="defect-table w-full text-sm text-left whitespace-nowrap">
                        <thead class="text-xs text-red-900 uppercase bg-red-100/80 border-b-2 border-red-200 shadow-sm">
                            <tr>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider w-24 text-center">วันที่ตรวจ</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider w-32">สาขา</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider w-48">อุปกรณ์</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider w-32 text-center">หมายเลข</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider">รายละเอียดข้อบกพร่อง / หมายเหตุ</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider w-32">ผู้ตรวจสอบ</th>
                            </tr>
                        </thead>
                        <tbody id="defect-table-body" class="divide-y divide-slate-200 text-slate-700">
                            <tr>
                                <td colspan="6" class="px-6 py-12 text-center text-slate-500">
                                    <svg class="w-16 h-16 mx-auto text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path></svg>
                                    กรุณากดปุ่ม <b>"ค้นหา"</b> เพื่อเริ่มสแกนหาอุปกรณ์ที่ชำรุดตามวันที่คุณระบุ
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const MONTHLY_SCRIPT_URLS = [
            'https://script.google.com/macros/s/AKfycbxeqQDZMAPu7xuQkwFAU_rsVY4r_ttS_QVSISA9HFoLZSB97NKXeOdSZoxAkIotZTdf/exec',
            'https://script.google.com/macros/s/AKfycbzy25HmhhLEg_-rOKr4K2VHSMkSvtDZ4uyk18ZB9oNFj1h9CK7K90Z35Vwn3qfzYjsGMg/exec',
            'https://script.google.com/macros/s/AKfycbwiAjQUEiRzV7owrChPpTohvDBBdXFidYSIXKmb4BbDNkxkWPWLsQlvOAxydlK5G4aEeg/exec',
            'https://script.google.com/macros/s/AKfycbxtF4WXCYX5DSfT-cUvmrg90wAJara-EwMop3aBRbxZbk4Y__eLDCd5uLvZN0PvlRVL/exec',
            'https://script.google.com/macros/s/AKfycbyEU8sYHITnEwUjxdKeIgybiCQ2dJOra0yCGf9KmN-Lk1ZnQN5M4q4irBViddXEHsPl/exec',
            'https://script.google.com/macros/s/AKfycbxjQuyZh8cdGxWJOiWwilcRBoVR3YJLtGXLxXR4ULod54d5UIHwB6tBYZ57iJxGkkrF/exec',
            'https://script.google.com/macros/s/AKfycbzfUotb2OaRKU3z3L_6NHfnbaMqQNEjGcDWxJuXVwPVB55sn7SO04HTGeD82VpeUh8/exec',
            'https://script.google.com/macros/s/AKfycbyeZgq72q1X2qxRVYNiu6CscP6NJ7vBsycue5D1ch0iIv1na0L6CygJtv435Ga6EJoFMA/exec'
        ];
        const SCRIPT_URLS = [
             'https://script.google.com/macros/s/AKfycbwsKgINhyiziRXNHyLVGjox-AoOYn4n1Iwz0vnLrX0tK26YGLGT0UOfzJfBU1fGbAlf/exec',
            'https://script.google.com/macros/s/AKfycbwZX0ywhNK28ZFXHNgEb9cYhl2IMtQpznVP4qykO1ptJorqNMrfDw-SSzYQjHUCQQ/exec',
            'https://script.google.com/macros/s/AKfycbzaukac9i4eXChJdU51UiqgXWHZ1BAZvxc1uwMl-63fYDfwavE636zRBlhZhrxpqP1x/exec',
            'https://script.google.com/macros/s/AKfycbx-EHtgugusHwmeIkuKhMmMW4ksZkqcfC_vChN5Mx08ITYP19VxPb8ZLhYxq8ulyy1mVQ/exec',
            'https://script.google.com/macros/s/AKfycby3tdPjqgdcHxxrBnTm32D4fZGPzo270JV3dKPSqxfhHkpVIHKm0RIxe37C94ruvDn-gw/exec',
            'https://script.google.com/macros/s/AKfycbxnEJjC_ODy3Hj2nT3VJA7a1n3enALzMYad5LBTjAZP5bDgos-TnjHv9zYfXcrTZLly/exec',
            'https://script.google.com/macros/s/AKfycbwypWDmtLLiBZEulgchBX4HqYiQfa0eVemXj8fYMNYQx7szSOJ6sWUzCe0t80MdbpHG/exec',
            'https://script.google.com/macros/s/AKfycbz87qYW144jARfWh8fAt3o-kWeBtQiT9z9WcpDJRrygzN76YOJOLFOmGSP8RgPe0KqKmw/exec'
        ];

        let allUsersList = [];
        let selectedBranches = new Set();
        const masterDevices = ["แก๊ส LPG", "สลิงผ้าแผนกเหล็ก", "เครนโครงสร้าง", "เครื่องตัดไฟเบอร์", "Stacker ไฟฟ้า", "รถเฮี้ยบ จัดส่ง", "รถจัดส่ง", "โฟล์คลิฟท์ประเภทเครื่องยนต์", "รถโฟล์คลิฟท์ไฟฟ้า", "รถสแตกเกอร์จัดส่ง", "สลิงผ้า รถจัดส่งติดเครน", "ตู้น้ำดับเพลิง", "ถังดับเพลิง", "ถังดับเพลิงCo2", "ไฟฉุกเฉิน"];
        let selectedDevices = new Set(masterDevices);
        let currentAbortController = null;
        let foundDefectsCount = 0;
        const labelsCache = {};

        function getNumberColumnIndex(title) {
            if (!title) return 9; 
            const normalizedTitle = title.toLowerCase().replace(/\s+/g, '');
            const keywords = ['ตู้น้ำดับเพลิง', 'ไฟฉุกเฉิน', 'ถังดับเพลิงco2', 'ถังดับเพลิง', 'co2', 'เคมีแห้ง'];
            if (keywords.some(kw => normalizedTitle.includes(kw))) return 10; 
            return 9; 
        }

        function getDataStartIndex(title, numberColIdx) {
            let idx = (numberColIdx === 10) ? 11 : 10; 
            if (title && title.toLowerCase().replace(/\s+/g, '').includes('co2')) {
                idx = 12; 
            }
            return idx;
        }

        function extractNumber(row, numberColIdx) {
            if (numberColIdx === 10) return String(row[10] || '').trim() || String(row[9] || '').trim();
            return String(row[9] || '').trim();
        }

        async function apiCall(action, payload = {}, scriptType = 'monthly', abortSignal = null) {
            const isGet = action.startsWith('load') || action.startsWith('get') || action === 'getAllUsers';
            const options = { method: isGet ? 'GET' : 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: abortSignal };
            const urls = scriptType === 'daily' ? [...SCRIPT_URLS] : [...MONTHLY_SCRIPT_URLS];
            
            for (let i = urls.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [urls[i], urls[j]] = [urls[j], urls[i]];
            }

            for (const baseUrl of urls) {
                const url = new URL(baseUrl);
                if (isGet) Object.entries({ action, ...payload }).forEach(([key, value]) => url.searchParams.append(key, value));
                else options.body = JSON.stringify({ action, ...payload });

                try {
                    const res = await fetch(url, options);
                    if (!res.ok) continue;
                    const result = await res.json();
                    if (result.error || result.success === false) continue;
                    return result;
                } catch (error) {
                    if (error.name === 'AbortError') throw error;
                    continue;
                }
            }
            throw new Error(`API Failed for action: ${action}`);
        }

        async function getLabels(cardTitle) {
            if (labelsCache[cardTitle]) return labelsCache[cardTitle];
            try {
                const result = await apiCall('getDataLabelsForCard', {
                    spreadsheetId: '17slzkEJpbc3YEcm0vQg_22QqTFtLyzp03-4CCIrmbpA',
                    sheetName: 'ชื่อข้อมูล',
                    cardTitle: cardTitle
                }, 'monthly'); 
                if (result && result.success && Array.isArray(result.labels)) {
                    labelsCache[cardTitle] = result.labels;
                    return result.labels;
                }
            } catch(e) {}
            labelsCache[cardTitle] = [];
            return [];
        }

        // ==========================================
        // UI & DROPDOWN LOGIC
        // ==========================================
        async function initPage() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('filter-date').value = `${yyyy}-${mm}-${dd}`;

            document.getElementById('branch-dropdown-label').textContent = "กำลังโหลดสาขา...";
            try {
                const cachedUsers = localStorage.getItem('cached_user_list');
                if (cachedUsers) {
                    allUsersList = JSON.parse(cachedUsers);
                } else {
                    const res = await apiCall('getAllUsers', {}, 'daily');
                    allUsersList = res.users || [];
                    localStorage.setItem('cached_user_list', JSON.stringify(allUsersList));
                }
                setupBranchDropdown();
                setupDeviceDropdown();
            } catch (error) {
                document.getElementById('branch-dropdown-label').textContent = "โหลดสาขาผิดพลาด";
                document.getElementById('device-dropdown-label').textContent = "โหลดอุปกรณ์ผิดพลาด";
            }
        }

        function setupBranchDropdown() {
            const container = document.getElementById('branch-checkboxes');
            container.innerHTML = '';
            selectedBranches.clear();

            allUsersList.forEach(user => {
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 py-1 px-1.5 hover:bg-slate-100 rounded-lg cursor-pointer text-xs font-semibold text-slate-700';
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = user;
                cb.className = 'rounded text-red-600 focus:ring-red-500 w-4 h-4 cursor-pointer';
                cb.checked = true;
                selectedBranches.add(user);

                cb.addEventListener('change', () => {
                    if (cb.checked) selectedBranches.add(user);
                    else selectedBranches.delete(user);
                    updateBranchDropdownLabel();
                    triggerAutoScan();
                });

                label.appendChild(cb);
                label.appendChild(document.createTextNode(user));
                container.appendChild(label);
            });
            updateBranchDropdownLabel();
        }

        function updateBranchDropdownLabel() {
            const label = document.getElementById('branch-dropdown-label');
            if (selectedBranches.size === 0) label.textContent = "ไม่ได้เลือกสาขา";
            else if (selectedBranches.size === allUsersList.length) label.textContent = `เลือกทุกสาขา (${allUsersList.length})`;
            else label.textContent = `เลือกแล้ว (${selectedBranches.size} สาขา)`;
        }

        function setupDeviceDropdown() {
            const container = document.getElementById('device-checkboxes');
            container.innerHTML = '';
            selectedDevices.clear();

            masterDevices.forEach(device => {
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 py-1 px-1.5 hover:bg-slate-100 rounded-lg cursor-pointer text-xs font-semibold text-slate-700';
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = device;
                cb.className = 'rounded text-red-600 focus:ring-red-500 w-4 h-4 cursor-pointer';
                cb.checked = true;
                selectedDevices.add(device);

                cb.addEventListener('change', () => {
                    if (cb.checked) selectedDevices.add(device);
                    else selectedDevices.delete(device);
                    updateDeviceDropdownLabel();
                    triggerAutoScan();
                });

                label.appendChild(cb);
                label.appendChild(document.createTextNode(device)); 
                container.appendChild(label);
            });
            updateDeviceDropdownLabel();
        }

        function updateDeviceDropdownLabel() {
            const label = document.getElementById('device-dropdown-label');
            if (selectedDevices.size === 0) label.textContent = "ไม่ได้เลือกอุปกรณ์";
            else if (selectedDevices.size === masterDevices.length) label.textContent = `ทุกอุปกรณ์ (${masterDevices.length})`;
            else label.textContent = `เลือกแล้ว (${selectedDevices.size})`;
        }

        // ==========================================
        // SCAN DEFECTS LOGIC
        // ==========================================
        let scanTimeout = null;

        function triggerAutoScan() {
            if (scanTimeout) clearTimeout(scanTimeout);
            scanTimeout = setTimeout(() => {
                startDefectScan();
            }, 500);
        }

        async function startDefectScan() {
            const tbody = document.getElementById('defect-table-body');
            const statusText = document.getElementById('status-text');
            const loader = document.getElementById('loading-indicator');

            if (selectedBranches.size === 0 || selectedDevices.size === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-orange-500 font-medium">กรุณาเลือก "สาขา" และ "อุปกรณ์" อย่างน้อย 1 รายการเพื่อดูข้อมูล</td></tr>`;
                document.getElementById('total-defects').textContent = "0";
                statusText.textContent = "รอการเลือกตัวกรอง...";
                if (currentAbortController) currentAbortController.abort();
                loader.classList.add('hidden');
                return;
            }
            
            const dateValue = document.getElementById('filter-date').value;
            if (!dateValue) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-orange-500 font-medium">กรุณาเลือกวันที่ต้องการค้นหา</td></tr>`;
                statusText.textContent = "รอระบุวันที่...";
                loader.classList.add('hidden');
                return;
            }

            const isAllMonth = document.getElementById('filter-all-month').checked;

            if (currentAbortController) currentAbortController.abort();
            currentAbortController = new AbortController();
            const signal = currentAbortController.signal;

            const [targetYearStr, targetMonthStr, targetDayStr] = dateValue.split('-');
            const targetYear = parseInt(targetYearStr);
            const targetMonth = parseInt(targetMonthStr);
            const targetDay = parseInt(targetDayStr);
            
            const branchesToScan = Array.from(selectedBranches);
            
            tbody.innerHTML = '';
            foundDefectsCount = 0;
            document.getElementById('total-defects').textContent = "0";
            
            loader.classList.remove('hidden');
            document.getElementById('refresh-button').disabled = true;

            let completedBranches = 0;
            const BATCH_SIZE = 5; 
            
            const queue = [...branchesToScan];

            async function worker() {
                while (queue.length > 0) {
                    if (signal.aborted) return;
                    const user = queue.shift();
                    
                    try {
                        const settingsRes = await apiCall('loadSettings', { username: user }, 'daily', signal);
                        const configs = Array.isArray(settingsRes.config) ? settingsRes.config : [];

                        const equipmentPromises = configs.map(async (config) => {
                            if (!selectedDevices.has(config.title)) return;
                            if (config.sheetId === 'N/A' || !config.sheetId) return;
                            
                            try {
                                const result = await apiCall('getMonthlySheetData', { sheetId: config.sheetId, sheetName: config.sheetName, year: targetYear, month: targetMonth }, 'monthly', signal);
                                const data = Array.isArray(result?.data) ? result.data : [];
                                const labels = await getLabels(config.title);
                                
                                const numberColIdx = getNumberColumnIndex(config.title);
                                const dataStartIndex = getDataStartIndex(config.title, numberColIdx);

                                const processedDefectNumbers = new Set();

                                data.forEach(row => {
                                    let rowYear = parseInt(row[3]);
                                    if (rowYear > 2500) rowYear -= 543;
                                    let rowMonth = parseInt(row[2]);
                                    let rowDay = parseInt(row[1]);

                                    if(isNaN(rowMonth) && row[0]) {
                                        const d = new Date(row[0]);
                                        if(!isNaN(d.getTime())){
                                            rowDay = d.getDate();
                                            rowMonth = d.getMonth() + 1;
                                            rowYear = d.getFullYear();
                                        }
                                    }

                                    // ตรวจสอบเงื่อนไขวันที่ตามที่ผู้ใช้เลือก (รายวัน หรือ ทั้งเดือน)
                                    const isMatchDate = isAllMonth 
                                        ? (rowYear === targetYear && rowMonth === targetMonth)
                                        : (rowYear === targetYear && rowMonth === targetMonth && rowDay === targetDay);

                                    if (isMatchDate) {
                                        let isDefect = false;
                                        let defectDetails = [];
                                        
                                        for(let i = dataStartIndex; i < row.length; i++) {
                                            const val = String(row[i]).trim();
                                            const valLower = val.toLowerCase();
                                            if(valLower === 'ไม่ปกติ' || valLower === 'ไม่ผ่าน' || valLower === 'ชำรุด') {
                                                isDefect = true;
                                                const labelName = labels[i - dataStartIndex] || `จุดตรวจที่ ${i - dataStartIndex + 1}`;
                                                defectDetails.push(`<span class="font-semibold text-slate-700">${labelName}:</span> <span class="text-red-600 font-bold">${val}</span>`);
                                            }
                                        }

                                        // --- ส่วนการตั้งค่า Index ดึงหมายเหตุตามประเภทอุปกรณ์ ---
                                        let remarkIdx = 14; // Default ที่คอลัมน์ O (14)
                                        const deviceName = config.title.trim();
                                        
                                        if (['สลิงผ้าแผนกเหล็ก', 'แก๊ส LPG', 'สลิงผ้า รถจัดส่งติดเครน'].includes(deviceName)) {
                                            remarkIdx = 19; // คอลัมน์ T
                                        } else if (deviceName === 'เครนโครงสร้าง') {
                                            remarkIdx = 27; // คอลัมน์ AB
                                        } else if (['เครื่องตัดไฟเบอร์', 'ตู้น้ำดับเพลิง', 'ถังดับเพลิงCo2'].includes(deviceName)) {
                                            remarkIdx = 18; // คอลัมน์ S
                                        } else if (deviceName === 'รถเฮี้ยบ จัดส่ง' || deviceName === 'รถเฮี๊ยบ') {
                                            remarkIdx = 34; // คอลัมน์ AI
                                        } else if (['Stacker ไฟฟ้า', 'โฟล์คลิฟท์ประเภทเครื่องยนต์'].includes(deviceName)) {
                                            remarkIdx = 26; // คอลัมน์ AA
                                        } else if (['รถจัดส่ง', 'รถสแตกเกอร์จัดส่ง'].includes(deviceName)) {
                                            remarkIdx = 29; // คอลัมน์ AD
                                        } else if (deviceName === 'รถโฟล์คลิฟท์ไฟฟ้า') {
                                            remarkIdx = 25; // คอลัมน์ Z
                                        } else if (deviceName === 'ไฟฉุกเฉิน' || deviceName === 'ถังดับเพลิง') {
                                            remarkIdx = 14; // คอลัมน์ O
                                        }

                                        let remark = row[remarkIdx] || '';
                                        remark = String(remark).trim();
                                        
                                        // ซ่อนคำว่า "ปกติ" หรือขีด "-" เพื่อไม่ให้รกตาราง
                                        if (remark === 'ปกติ' || remark === '-') {
                                            remark = '';
                                        }

                                        if (isDefect) {
                                            const number = extractNumber(row, numberColIdx) || 'ไม่ระบุ';
                                            const dateStr = `${rowDay.toString().padStart(2,'0')}/${targetMonth.toString().padStart(2,'0')}/${(targetYear+543).toString().slice(-2)}`;
                                            
                                            // ปรับ Key เช็คข้อมูลซ้ำให้มีวันที่ด้วย เพื่อให้แสดงข้อมูลซ้ำได้ถ้าอยู่คนละวันกัน
                                            const defectKey = number + '_' + dateStr;
                                            
                                            if (processedDefectNumbers.has(defectKey)) return; 
                                            processedDefectNumbers.add(defectKey); 

                                            const reporter = row[7] || '-';
                                            
                                            let detailText = '<ul class="list-none space-y-1.5 mt-2">';
                                            defectDetails.forEach(detail => {
                                                detailText += `<li class="flex items-start gap-1.5 text-sm">
                                                    <svg class="w-4 h-4 text-red-500 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                                                    <span>${detail}</span>
                                                </li>`;
                                            });
                                            detailText += '</ul>';

                                            if (remark) {
                                                detailText += `<div class="mt-2.5 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600">
                                                    <span class="font-bold text-slate-700">หมายเหตุ:</span> ${remark}
                                                </div>`;
                                            }

                                            const tr = document.createElement('tr');
                                            tr.className = 'hover:bg-red-50/50 transition-colors border-b border-slate-100';
                                            tr.innerHTML = `
                                                <td class="px-6 py-4 whitespace-nowrap text-center text-slate-500">${dateStr}</td>
                                                <td class="px-6 py-4 whitespace-nowrap font-bold text-slate-800">${user}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-slate-700">${config.title}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-center"><span class="bg-red-100 text-red-800 font-bold px-2.5 py-1 rounded-md border border-red-200">${number}</span></td>
                                                <td class="px-6 py-4 whitespace-normal min-w-[250px]">
                                                    <span class="inline-flex items-center gap-1 text-xs font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-200 mb-1">
                                                        <svg class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94l-1.72-1.72z" clip-rule="evenodd" /></svg> 
                                                        สถานะ: ไม่ปกติ
                                                    </span><br>
                                                    ${detailText}
                                                </td>
                                                <td class="px-6 py-4 whitespace-nowrap text-slate-600">${reporter}</td>
                                            `;
                                            tbody.appendChild(tr);
                                            foundDefectsCount++;
                                            document.getElementById('total-defects').textContent = foundDefectsCount;
                                        }
                                    }
                                });
                            } catch(e) {
                                // ข้าม error ของอุปกรณ์
                            }
                        });
                        
                        await Promise.all(equipmentPromises);
                        
                    } catch (e) {
                        if (e.name === 'AbortError') return;
                    }

                    if (signal.aborted) return;
                    completedBranches++;
                    statusText.textContent = `กำลังสแกน... สำเร็จแล้ว ${completedBranches} จาก ${branchesToScan.length} สาขา`;
                }
            }

            const workers = [];
            for (let i = 0; i < Math.min(BATCH_SIZE, queue.length); i++) {
                workers.push(worker());
            }

            await Promise.all(workers);

            if (!signal.aborted) {
                statusText.textContent = `ค้นหาเสร็จสิ้น (สแกนครบ ${branchesToScan.length} สาขา)`;
                loader.classList.add('hidden');
                document.getElementById('refresh-button').disabled = false;
                
                if (foundDefectsCount === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-green-600 bg-green-50/50"><svg class="w-16 h-16 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span class="text-lg font-bold">ยอดเยี่ยม!</span><br>ไม่พบอุปกรณ์ชำรุดในสาขา เครื่องมือ และวันที่ที่คุณเลือก</td></tr>`;
                }
            }
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initPage().then(() => {
                triggerAutoScan(); 
            });
        });
        document.getElementById('refresh-button').addEventListener('click', startDefectScan);

        document.getElementById('filter-date').addEventListener('change', triggerAutoScan);
        document.getElementById('filter-all-month').addEventListener('change', triggerAutoScan);

        const dropdownBtn = document.getElementById('branch-dropdown-btn');
        const dropdownMenu = document.getElementById('branch-dropdown-menu');
        const dropdownArrow = document.getElementById('branch-arrow');

        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('hidden');
            dropdownArrow.classList.toggle('rotate-180');
            
            document.getElementById('device-dropdown-menu').classList.add('hidden');
            document.getElementById('device-arrow').classList.remove('rotate-180');
        });

        const deviceDropdownBtn = document.getElementById('device-dropdown-btn');
        const deviceDropdownMenu = document.getElementById('device-dropdown-menu');
        const deviceDropdownArrow = document.getElementById('device-arrow');

        deviceDropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deviceDropdownMenu.classList.toggle('hidden');
            deviceDropdownArrow.classList.toggle('rotate-180');
            
            dropdownMenu.classList.add('hidden');
            dropdownArrow.classList.remove('rotate-180');
        });

        document.getElementById('branch-select-all').addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('#branch-checkboxes input').forEach(cb => cb.checked = true);
            selectedBranches = new Set(allUsersList);
            updateBranchDropdownLabel();
            triggerAutoScan();
        });

        document.getElementById('branch-clear-all').addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('#branch-checkboxes input').forEach(cb => cb.checked = false);
            selectedBranches.clear();
            updateBranchDropdownLabel();
            triggerAutoScan();
        });

        document.getElementById('device-select-all').addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('#device-checkboxes input').forEach(cb => cb.checked = true);
            selectedDevices = new Set(masterDevices);
            updateDeviceDropdownLabel();
            triggerAutoScan();
        });

        document.getElementById('device-clear-all').addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('#device-checkboxes input').forEach(cb => cb.checked = false);
            selectedDevices.clear();
            updateDeviceDropdownLabel();
            triggerAutoScan();
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('branch-select-container').contains(e.target)) {
                dropdownMenu.classList.add('hidden');
                dropdownArrow.classList.remove('rotate-180');
            }
            if (!document.getElementById('device-select-container').contains(e.target)) {
                deviceDropdownMenu.classList.add('hidden');
                deviceDropdownArrow.classList.remove('rotate-180');
            }
        });

    </script>
</body>
</html>
